# Deploy no Coolify via build pack "Docker Compose" (não "Dockerfile").
# Aponte "Docker Compose Location" para /docker-compose.prod.yml ao importar
# o projeto. Diferente do build pack "Dockerfile" puro, o Coolify lê as
# variáveis ${...} referenciadas abaixo e monta os campos para você
# preencher no painel. POSTGRES_PASSWORD e SESSION_SECRET ficam sem default
# de propósito (para o Coolify sinalizar que são obrigatórias) — de
# propósito também sem a sintaxe "${VAR:?mensagem}": o parser de variáveis
# do Coolify não entende esse modificador direito e gera um build-arg
# quebrado a partir da mensagem de erro. A validação de "obrigatório, com
# mensagem clara" mora em docker-entrypoint.sh, fora do compose.
#
# Para desenvolvimento local use o docker-compose.yml da raiz (só Postgres)
# — este arquivo aqui é só para deploy.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-financebot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-financebot}?schema=public"
      SESSION_SECRET: "${SESSION_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      # "false" só se estiver acessando via HTTP puro (sem domínio/TLS no
      # Coolify ainda) — sem isso o cookie de sessão fica marcado Secure e o
      # navegador se recusa a guardá-lo numa conexão insegura (login parece
      # funcionar, mas todo clique volta pro /login). O certo pra produção é
      # configurar HTTPS no Coolify e deixar essa variável em branco.
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      PLUGGY_CLIENT_ID: "${PLUGGY_CLIENT_ID:-}"
      PLUGGY_CLIENT_SECRET: "${PLUGGY_CLIENT_SECRET:-}"
      PLUGGY_USE_SANDBOX: "${PLUGGY_USE_SANDBOX:-false}"
      PLUGGY_WEBHOOK_URL: "${PLUGGY_WEBHOOK_URL:-}"
      # Leitura de nota fiscal por IA (Eventos) — em branco esconde o botão
      # "Ler nota fiscal" e não muda mais nada, o resto do app funciona igual.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      # Fixo — é o que o Dockerfile expõe. O lado esquerdo do mapeamento de
      # porta abaixo (APP_PORT) é o que fica configurável pelo painel.
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Sem healthcheck: aqui — herda o HEALTHCHECK já definido no Dockerfile.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-financebot}"
      # Sem default de propósito — e sem precisar de validação nossa: a
      # própria imagem oficial do Postgres já recusa subir sem essa
      # variável, com uma mensagem de erro clara nos logs.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-financebot}"
    volumes:
      - financebot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financebot} -d ${POSTGRES_DB:-financebot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  financebot_postgres_data:
